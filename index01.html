<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simple Tic-Tac-Toe</title>
        <style>
            :root {
                --primary: #4a90e2;
                --primary-hover: #357abd;
                --bg: #f5f7fa;
                --text: #333;
                --board-bg: #fff;
                --shadow: rgba(0, 0, 0, 0.15);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                background: var(--bg);
                color: var(--text);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;
            }

            .container {
                text-align: center;
                width: 100%;
                max-width: 400px;
                padding: 20px;
            }

            h1 {
                margin-bottom: 20px;
                font-size: 2.5rem;
                color: #2c3e50;
            }

            /* Status Text */
            .status {
                font-size: 1.2rem;
                margin-bottom: 20px;
                font-weight: 600;
                height: 30px;
            }

            /* The Board */
            .board {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-gap: 10px;
                background-color: #ccc;
                padding: 10px;
                border-radius: 10px;
                box-shadow: 0 8px 16px var(--shadow);
            }

            .cell {
                background-color: var(--board-bg);
                aspect-ratio: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 3rem;
                font-weight: bold;
                cursor: pointer;
                border-radius: 5px;
                transition:
                    background 0.2s,
                    transform 0.1s;
                user-select: none;
            }

            .cell:hover {
                background-color: #f0f0f0;
            }

            .cell:active {
                transform: scale(0.95);
            }

            .cell.X {
                color: #e74c3c;
            }

            .cell.O {
                color: #3498db;
            }

            /* Overlays */
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            .modal {
                background: white;
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
                text-align: center;
                width: 90%;
                max-width: 350px;
                transform: scale(0.8);
                transition: transform 0.3s ease;
            }

            .overlay.active .modal {
                transform: scale(1);
            }

            .modal h2 {
                margin-bottom: 20px;
                color: #2c3e50;
            }

            /* Form Controls */
            .form-group {
                margin-bottom: 20px;
                text-align: left;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #555;
            }

            select,
            button {
                width: 100%;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-size: 1rem;
                outline: none;
            }

            select {
                background: #fff;
                cursor: pointer;
            }

            button {
                background: var(--primary);
                color: white;
                border: none;
                font-weight: bold;
                cursor: pointer;
                margin-top: 10px;
                transition: background 0.2s;
            }

            button:hover {
                background: var(--primary-hover);
            }

            /* Result Specifics */
            #result-text {
                font-size: 1.5rem;
                font-weight: bold;
                margin-bottom: 25px;
                color: #2c3e50;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Tic-Tac-Toe</h1>
            <div class="status" id="status-text">Player X's turn</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <div class="overlay active" id="settings-overlay">
            <div class="modal">
                <h2>Game Settings</h2>
                <div class="form-group">
                    <label for="mode-select">Game Mode</label>
                    <select id="mode-select">
                        <option value="1">1 Player (vs Computer)</option>
                        <option value="2">2 Players</option>
                    </select>
                </div>
                <div class="form-group" id="first-move-group">
                    <label for="first-move-select">Who Goes First?</label>
                    <select id="first-move-select">
                        <option value="player">Player (X)</option>
                        <option value="computer">Computer (O)</option>
                    </select>
                </div>
                <button id="start-btn">Start Game</button>
            </div>
        </div>

        <div class="overlay" id="result-overlay">
            <div class="modal">
                <h2>Game Over</h2>
                <div id="result-text">Player X Wins!</div>
                <button id="reset-btn">Play Again</button>
            </div>
        </div>

        <script>
            // Game State Variables
            let boardState = ["", "", "", "", "", "", "", "", ""];
            let isGameActive = false;
            let currentPlayer = "X"; // X always goes first technically, but assignments change
            let gameMode = "1"; // "1" or "2"
            let firstMove = "player"; // "player" or "computer"

            // Roles tracking for 1-player mode
            let playerSign = "X";
            let computerSign = "O";

            // Winning Combinations
            const winningConditions = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8], // Rows
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8], // Columns
                [0, 4, 8],
                [2, 4, 6], // Diagonals
            ];

            // DOM Elements
            const settingsOverlay = document.getElementById("settings-overlay");
            const resultOverlay = document.getElementById("result-overlay");
            const modeSelect = document.getElementById("mode-select");
            const firstMoveSelect =
                document.getElementById("first-move-select");
            const firstMoveGroup = document.getElementById("first-move-group");
            const startBtn = document.getElementById("start-btn");
            const resetBtn = document.getElementById("reset-btn");
            const resultText = document.getElementById("result-text");
            const statusText = document.getElementById("status-text");
            const cells = document.querySelectorAll(".cell");

            // Dynamic Settings UI Toggle
            modeSelect.addEventListener("change", () => {
                if (modeSelect.value === "2") {
                    firstMoveGroup.style.display = "none";
                } else {
                    firstMoveGroup.style.display = "block";
                }
            });

            // Start Game
            startBtn.addEventListener("click", () => {
                gameMode = modeSelect.value;
                firstMove = firstMoveSelect.value;

                initGame();
                settingsOverlay.classList.remove("active");
            });

            // Reset back to main screen
            resetBtn.addEventListener("click", () => {
                resultOverlay.classList.remove("active");
                settingsOverlay.classList.add("active");
            });

            // Initialize / Reset Board Game State
            function initGame() {
                boardState = ["", "", "", "", "", "", "", "", ""];
                isGameActive = true;

                // Clean UI Board
                cells.forEach((cell) => {
                    cell.textContent = "";
                    cell.className = "cell";
                });

                if (gameMode === "1") {
                    if (firstMove === "player") {
                        playerSign = "X";
                        computerSign = "O";
                        currentPlayer = "X";
                        statusText.textContent = "Your turn (X)";
                    } else {
                        playerSign = "O";
                        computerSign = "X";
                        currentPlayer = "X"; // Systematically X goes first
                        statusText.textContent = "Computer is thinking...";
                        setTimeout(makeComputerMove, 500);
                    }
                } else {
                    // 2 Players mode
                    currentPlayer = "X";
                    statusText.textContent = "Player X's turn";
                }
            }

            // Handle Cell Clicks
            cells.forEach((cell) => {
                cell.addEventListener("click", (e) => {
                    const clickedCellIndex = parseInt(
                        e.target.getAttribute("data-index"),
                    );

                    if (boardState[clickedCellIndex] !== "" || !isGameActive) {
                        return;
                    }

                    // If 1-player mode, block input when it's the computer's turn
                    if (gameMode === "1" && currentPlayer === computerSign) {
                        return;
                    }

                    handleCellPlayed(e.target, clickedCellIndex);
                    handleResultValidation();
                });
            });

            function handleCellPlayed(clickedCell, clickedCellIndex) {
                boardState[clickedCellIndex] = currentPlayer;
                clickedCell.textContent = currentPlayer;
                clickedCell.classList.add(currentPlayer);
            }

            function changePlayer() {
                currentPlayer = currentPlayer === "X" ? "O" : "X";

                if (gameMode === "2") {
                    statusText.textContent = `Player ${currentPlayer}'s turn`;
                } else {
                    if (currentPlayer === playerSign) {
                        statusText.textContent = "Your turn!";
                    } else {
                        statusText.textContent = "Computer is thinking...";
                        setTimeout(makeComputerMove, 500);
                    }
                }
            }

            function handleResultValidation() {
                let roundWon = false;
                let winner = "";

                for (let i = 0; i < winningConditions.length; i++) {
                    const winCondition = winningConditions[i];
                    let a = boardState[winCondition[0]];
                    let b = boardState[winCondition[1]];
                    let c = boardState[winCondition[2]];

                    if (a === "" || b === "" || c === "") {
                        continue;
                    }
                    if (a === b && b === c) {
                        roundWon = true;
                        winner = a;
                        break;
                    }
                }

                if (roundWon) {
                    endGame(winner);
                    return;
                }

                let roundDraw = !boardState.includes("");
                if (roundDraw) {
                    endGame("Draw");
                    return;
                }

                changePlayer();
            }

            // Simple Smart AI Move Strategy
            function makeComputerMove() {
                if (!isGameActive) return;

                // 1. Can Computer Win immediately?
                let move = findWinningMove(computerSign);

                // 2. Can Computer Block Player from winning?
                if (move === null) {
                    move = findWinningMove(playerSign);
                }

                // 3. Take Center if open
                if (move === null && boardState[4] === "") {
                    move = 4;
                }

                // 4. Random fallback
                if (move === null) {
                    let availableCells = [];
                    boardState.forEach((val, index) => {
                        if (val === "") availableCells.push(index);
                    });
                    if (availableCells.length > 0) {
                        move =
                            availableCells[
                                Math.floor(
                                    Math.random() * availableCells.length,
                                )
                            ];
                    }
                }

                if (move !== null) {
                    const targetCell = document.querySelector(
                        `[data-index="${move}"]`,
                    );
                    handleCellPlayed(targetCell, move);
                    handleResultValidation();
                }
            }

            function findWinningMove(sign) {
                for (let i = 0; i < winningConditions.length; i++) {
                    const [a, b, c] = winningConditions[i];
                    if (
                        boardState[a] === sign &&
                        boardState[b] === sign &&
                        boardState[c] === ""
                    )
                        return c;
                    if (
                        boardState[a] === sign &&
                        boardState[c] === sign &&
                        boardState[b] === ""
                    )
                        return b;
                    if (
                        boardState[b] === sign &&
                        boardState[c] === sign &&
                        boardState[a] === ""
                    )
                        return a;
                }
                return null;
            }

            function endGame(outcome) {
                isGameActive = false;

                if (outcome === "Draw") {
                    resultText.textContent = "It's a Draw!";
                } else {
                    if (gameMode === "2") {
                        resultText.textContent = `Player ${outcome} Wins!`;
                    } else {
                        resultText.textContent =
                            outcome === playerSign
                                ? "🎉 You Won!"
                                : "🤖 Computer Won!";
                    }
                }

                // Show result overlay
                setTimeout(() => {
                    resultOverlay.classList.add("active");
                }, 600);
            }
        </script>
    </body>
</html>
